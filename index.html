<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل طالب جديد - EMP</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
--main-blue: #0a70f3;
--dark-blue: #054c9e;
--bg-color: #f0f2f5;
--white: #ffffff;
--card-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Cairo', sans-serif;
}

body {
background-color: var(--bg-color);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
}

/* تأثير Fade In عند فتح الصفحة */
.fade-in {
animation: fadeIn 0.6s ease-in-out forwards;
}

@keyframes fadeIn {
from { opacity: 0; transform: translateY(15px); }
to { opacity: 1; transform: translateY(0); }
}

.form-container {
background: var(--white);
width: 100%;
max-width: 500px;
padding: 30px;
border-radius: 16px;
box-shadow: var(--card-shadow);
border-top: 5px solid var(--main-blue);
}

.form-header {
text-align: center;
margin-bottom: 20px;
}

.form-header h2 {
color: var(--dark-blue);
font-weight: 800;
margin-bottom: 5px;
}

.form-group {
margin-bottom: 15px;
text-align: right;
}

.form-group label {
display: block;
margin-bottom: 5px;
font-weight: 600;
color: #333;
}

.form-group input, .form-group select {
width: 100%;
padding: 12px;
border: 2px solid #e0e6ed;
border-radius: 8px;
font-size: 0.95rem;
outline: none;
transition: border-color 0.3s;
}

.form-group input:focus, .form-group select:focus {
border-color: var(--main-blue);
}

.btn-submit {
width: 100%;
background: var(--main-blue);
color: white;
border: none;
padding: 14px;
border-radius: 8px;
font-weight: 700;
font-size: 1rem;
cursor: pointer;
transition: background 0.3s;
margin-top: 10px;
}

.btn-submit:hover {
background: var(--dark-blue);
}
</style>
</head>
<body>

<div class="form-container fade-in">
<div class="form-header">
<h2>تسجيل طالب جديد - EMP</h2>
<p>أدخل بيانات الطالب للالتحاق بالبرنامج</p>
</div>

<form id="studentForm">
<div class="form-group">
<label>الاسم رباعي</label>
<input type="text" id="fullName" required placeholder="مثال: محمد أحمد علي">
</div>

<div class="form-group">
<label>العمر</label>
<input type="number" id="age" required placeholder="أدخل العمر">
</div>

<div class="form-group">
<label>رقم حدود الطالب</label>
<input type="text" id="borderNumber" required placeholder="أدخل رقم الحدود">
</div>

<div class="form-group">
<label>السكن الحالي</label>
<input type="text" id="address" required placeholder="المدينة / الحي">
</div>

<div class="form-group">
<label>رقم ولي الأمر</label>
<input type="tel" id="parentPhone" required placeholder="05xxxxxxxx">
</div>

<div class="form-group">
<label>رقم الترحيل</label>
<input type="tel" id="transportPhone" placeholder="اختياري">
</div>

<div class="form-group">
<label>المدرسة الحالية</label>
<select id="schoolSelect" required>
<option value="" disabled selected>حدد المدرسة الحالية...</option>
<option value="مدرسة جيل الإبداع والتميز">مدرسة جيل الإبداع والتميز</option>
<option value="مدرسة أخرى">مدرسة أخرى</option>
</select>
</div>

<div class="form-group">
<label>مستوى الطالب في اللغة الإنجليزية</label>
<select id="levelSelect" required>
<option value="" disabled selected>حدد المستوى...</option>
<option value="مبتدئ">مبتدئ</option>
<option value="متوسط">متوسط</option>
<option value="جيد جداً">جيد جداً</option>
<option value="ممتاز">ممتاز</option>
</select>
</div>

<button type="submit" class="btn-submit" id="submitBtn">تأكيد وإرسال البيانات</button>
</form>
</div>

<!-- مكتبات Firebase SDK (Compat v9) -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<script>
// مفاتيح مشروع Firebase الخاص بك
const firebaseConfig = {
apiKey: "AIzaSyBKNYzhD6yJqtBywDSGHE0-RgvJZ4Cw74I",
authDomain: "english-mastery-program.firebaseapp.com",
projectId: "english-mastery-program",
storageBucket: "english-mastery-program.firebasestorage.app",
messagingSenderId: "351145575770",
appId: "1:351145575770:web:49c375d96b1563b3385f63",
measurementId: "G-CFNS5HZXNW"
};

// تهيئة Firebase و Firestore
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// إرسال البيانات لقاعدة البيانات عند الضغط على الزر
document.getElementById('studentForm').addEventListener('submit', async (e) => {
e.preventDefault();

const submitBtn = document.getElementById('submitBtn');
submitBtn.innerText = "جاري الإرسال...";
submitBtn.disabled = true;

const studentData = {
fullName: document.getElementById('fullName').value.trim(),
age: document.getElementById('age').value.trim(),
borderNumber: document.getElementById('borderNumber').value.trim(),
address: document.getElementById('address').value.trim(),
parentPhone: document.getElementById('parentPhone').value.trim(),
transportPhone: document.getElementById('transportPhone').value.trim(),
school: document.getElementById('schoolSelect').value,
englishLevel: document.getElementById('levelSelect').value,
createdAt: firebase.firestore.FieldValue.serverTimestamp()
};

try {
await db.collection("emp_students").add(studentData);
alert("تم تسجيل الطالب بنجاح!");
document.getElementById('studentForm').reset();
} catch (error) {
console.error("خطأ أثناء الحفظ: ", error);
alert("حدث خطأ أثناء الإرسال، يُرجى التأكد من تفعيل Firestore Database في Firebase.");
} finally {
submitBtn.innerText = "تأكيد وإرسال البيانات";
submitBtn.disabled = false;
}
});
</script>
</body>
</html>
